[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chunk-trajectory-error"
version = "0.1.0"
description = "Training-only trajectory error surrogate for action-chunk policies"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]