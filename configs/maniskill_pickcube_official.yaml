# Experiment 1 with the official demonstrations (GPU-workstation run). Identical to
# configs/maniskill_pickcube.yaml except for the data paths, the output directory and the provenance note.
experiment:
  name: maniskill_pickcube_audit
  seed: 17
  output_dir: runs/maniskill_pickcube_official

environment:
  backend: maniskill
  task: PickCube-v1
  sim_backend: physx_cpu
  obs_mode: state
  control_mode: pd_ee_delta_pos
  max_episode_steps: 200

models:
  policy:
    type: mlp_chunk
    hidden_dims: [256, 256]
  error_network:
    type: history_conditioned_mlp
    hidden_dim: 128

data:
  source: official_motionplanning
  provenance_note: >-
    Official PickCube-v1 demonstrations (python -m mani_skill.utils.download_demo PickCube-v1; 1000 episodes,
    the first 600 used via audit.num_episodes), replayed into pd_ee_delta_pos / state / physx_cpu.
    This is the configuration of the GPU-workstation run in runs/maniskill_pickcube_official/ and the base
    (source) configuration of the sim-to-sim pilot. The demonstration files are not committed; see README.md.
  trajectory_path: data/raw/maniskill_official/trajectory.h5
  replayed_trajectory_path: data/processed/maniskill_official/trajectory.state.pd_ee_delta_pos.physx_cpu.h5
  split_manifest: data/processed/maniskill_official/splits.json
  output_dir: data/processed/maniskill_official

chunk:
  horizon: 20
  execute_steps: 5
  history_steps: 15
  evaluation_steps: 10
  train_delay: 0
  evaluation_delays: [0, 2, 4]

audit:
  replay_position_tolerance_m: 0.001
  branch_repeat_tolerance_m: 0.000001
  control_min_motion_m: 0.002
  anchors_per_episode: 3
  num_episodes: 600
  render_video: true
  split_ratio: [4, 1, 1]
  video_fps: 10

observation:
  # PickCube-v1 state layout (42): qpos 9, qvel 9, is_grasped 1, tcp_pose 7, goal_pos 3,
  # obj_pose 7, tcp_to_obj 3, obj_to_goal 3.  03 verifies tcp_position_slice against the simulator.
  tcp_position_slice: [19, 22]
  robot_state_slice: [0, 26]

action:
  gripper_dims: [3]

bc:
  steps: 20000
  batch_size: 256
  lr: 0.001
  eval_every: 1000

branches:
  anchors_per_episode: {train: 4, val: 3, test: 3}
  policy_perturbed_per_anchor: 4
  expert_perturbed_per_anchor: 2
  perturbation_amplitude: [0.01, 0.2]

error_training:
  steps: 15000
  batch_size: 256
  lr: 0.001
  eval_every: 1000

gradient_audit:
  step_sizes: [0.02, 0.05, 0.1, 0.2, 0.4]

policy_finetune:
  steps: 5000
  batch_size: 256
  lr: 0.0003
  lambdas: [0.0, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0]
  smooth_betas: [0.1, 0.3, 1.0]

evaluation:
  delays: [0, 2, 4]
  fresh_seeds: {start: 100000, count: 50}
  latency_repeats: 2000
